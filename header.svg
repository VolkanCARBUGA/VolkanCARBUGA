<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="240" role="img" aria-label="Volkan Çarbuğa — Mobile, Full-Stack, AI & Systems Developer">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0D1B36"/>
      <stop offset="100%" stop-color="#0A3A6E"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#64D2FF" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64D2FF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#64D2FF"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#64D2FF" fill-opacity="0.14"/>
    </pattern>
  </defs>

  <!-- Arka plan -->
  <rect width="1200" height="240" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="240" rx="16" fill="url(#dots)"/>

  <!-- Yumuşak parlayan küreler -->
  <circle cx="180" cy="40" r="140" fill="#0A84FF" fill-opacity="0.14"/>
  <circle cx="1040" cy="190" r="160" fill="#38BDF8" fill-opacity="0.12"/>

  <!-- Animasyonlu dalgalar -->
  <path fill="url(#wave1)">
    <animate attributeName="d" dur="9s" repeatCount="indefinite"
      values="M0,185 C260,135 480,225 760,175 C980,135 1100,195 1200,175 L1200,240 L0,240 Z;
              M0,170 C280,220 520,135 790,190 C990,225 1110,150 1200,180 L1200,240 L0,240 Z;
              M0,185 C260,135 480,225 760,175 C980,135 1100,195 1200,175 L1200,240 L0,240 Z"/>
  </path>
  <path fill="url(#wave2)">
    <animate attributeName="d" dur="12s" repeatCount="indefinite"
      values="M0,200 C300,235 600,160 900,205 C1060,225 1140,185 1200,195 L1200,240 L0,240 Z;
              M0,195 C320,160 620,235 920,185 C1070,165 1150,210 1200,190 L1200,240 L0,240 Z;
              M0,200 C300,235 600,160 900,205 C1060,225 1140,185 1200,195 L1200,240 L0,240 Z"/>
  </path>

  <!-- Ana İsim & Ünvan -->
  <text x="600" y="102" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="0.5">
    Volkan Çarbuğa
  </text>

  <rect x="490" y="118" width="220" height="3.5" rx="2" fill="url(#accentBar)"/>

  <text x="600" y="154" text-anchor="middle" fill="#BAE6FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" letter-spacing="1.2">
    MOBILE • FULL-STACK • AI &amp; SYSTEMS DEVELOPER
  </text>
</svg>
